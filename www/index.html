<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#FFFFFF;color:#121615;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:4vh 5vw;min-height:100svh;-webkit-font-smoothing:antialiased}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lg{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,26px)}
.lg svg{display:block;height:clamp(96px,17vh,164px);width:auto}
.nz{display:flex;flex-direction:column;align-items:center;line-height:1;gap:clamp(6px,1vh,11px)}
.nz b{font-size:clamp(26px,4.4vw,46px);font-weight:500;letter-spacing:.2em;color:#1F5C4A;text-indent:.2em}
.nz span{font-size:clamp(11px,1.7vw,17px);font-weight:400;letter-spacing:.34em;color:#3F7A66;text-indent:.34em}
.lg path{opacity:0;transform:translateY(7px);animation:mk .6s cubic-bezier(.33,1,.68,1) forwards}
.lg path:nth-child(1){animation-delay:.08s}.lg path:nth-child(2){animation-delay:.16s}
.lg path:nth-child(3){animation-delay:.24s}.lg path:nth-child(4){animation-delay:.32s}
.lg path:nth-child(5){animation-delay:.40s}
.nz b,.nz span{opacity:0;animation:fd .7s ease forwards}
.nz b{animation-delay:.56s}.nz span{animation-delay:.68s}
@keyframes mk{to{opacity:1;transform:none}}
@keyframes fd{to{opacity:1}}
.stop{text-align:center;line-height:1.7;opacity:0;animation:fd .8s ease .9s forwards}
.stop .t{font-size:clamp(13px,1.5vw,16px);color:#4A524F}
.stop .k{font-size:clamp(14px,1.6vw,17px);margin-top:6px}
.stop a{color:#1F5C4A;text-decoration:none;border-bottom:1px solid rgba(31,92,74,.35);padding-bottom:1px}
.stop a:hover{border-color:#1F5C4A}
.stop a:focus-visible{outline:2px solid #1F5C4A;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.lg path,.nz b,.nz span,.stop{animation:none;opacity:1;transform:none}}
</style>
</head>
